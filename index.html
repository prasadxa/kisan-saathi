<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kisan Saathi</title>
<style>
:root{--bg:#f6f3ea;--card:#fff;--ink:#1f2a1f;--muted:#5b665b;--line:#ddd6c4;--brand:#2f6b2f;--brand-ink:#fff;
--red:#b3261e;--red-bg:#fde8e6;--amber:#8a5a00;--amber-bg:#fff3d6;--blue:#1d4f8a;--blue-bg:#e3eefb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a14;--card:#1d241d;--ink:#e8efe6;--muted:#a3aea1;--line:#334033;--brand:#6fb56f;--brand-ink:#0d150d;
--red:#ff8a80;--red-bg:#3a1714;--amber:#ffcc66;--amber-bg:#352a10;--blue:#8fbaf0;--blue-bg:#13263d}}
:root[data-theme="dark"]{--bg:#141a14;--card:#1d241d;--ink:#e8efe6;--muted:#a3aea1;--line:#334033;--brand:#6fb56f;--brand-ink:#0d150d;
--red:#ff8a80;--red-bg:#3a1714;--amber:#ffcc66;--amber-bg:#352a10;--blue:#8fbaf0;--blue-bg:#13263d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 16px}
h1{margin:0;font-size:1.6rem;color:var(--brand)}
.tag{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.langs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit}
.langs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
h2{font-size:1.15rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.full{grid-column:1/-1}
.btn{display:inline-block;border:0;background:var(--brand);color:var(--brand-ink);padding:12px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.banner{border-radius:14px;padding:16px;margin-bottom:16px;font-size:1.05rem}
.banner b{display:block;font-size:1.25rem;margin-bottom:4px}
.urgent{background:var(--red-bg);color:var(--red);border:2px solid var(--red)}
.late{background:var(--amber-bg);color:var(--amber);border:2px solid var(--amber)}
.area{background:var(--blue-bg);color:var(--blue);border:2px solid var(--blue)}
ul{margin:0;padding-left:20px}
li{margin:4px 0}
.check li{list-style:none;margin-left:-20px}
.check input{width:auto;margin-right:8px}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;margin:0}
.foot{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:12px;font-weight:600}
.hidden{display:none}
.err{color:var(--red);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🌾 Kisan Saathi</h1>
      <p class="tag" data-t="tagline"></p>
    </div>
    <div class="langs">
      <button data-lang="mr">मराठी</button>
      <button data-lang="hi">हिंदी</button>
      <button data-lang="en">English</button>
    </div>
  </header>

  <form id="f" class="card">
    <h2 data-t="s1"></h2>
    <div class="grid">
      <div><label data-t="name"></label><input id="name" required></div>
      <div><label data-t="mobile"></label><input id="mobile" inputmode="numeric" maxlength="10"></div>
      <div><label data-t="state"></label><input id="state" value="Maharashtra"></div>
      <div><label data-t="district"></label>
        <select id="district">
          <option>Beed</option><option>Chhatrapati Sambhajinagar</option><option>Jalna</option><option>Latur</option>
          <option>Dharashiv</option><option>Nanded</option><option>Parbhani</option><option>Hingoli</option><option value="other" data-t="other"></option>
        </select></div>
      <div><label data-t="village"></label><input id="village"></div>
      <div><label data-t="survey"></label><input id="survey"></div>
      <div><label data-t="crop"></label>
        <select id="crop"></select></div>
      <div><label data-t="acres"></label><input id="acres" type="number" min="0" step="0.1" required></div>
      <div class="full"><label data-t="event"></label>
        <select id="event"></select></div>
      <div><label data-t="date"></label><input id="date" type="datetime-local" required></div>
      <div><label data-t="pmfby"></label>
        <select id="pmfby"><option value="yes" data-t="yes"></option><option value="no" data-t="no"></option><option value="unsure" data-t="unsure"></option></select></div>
      <div class="full"><label data-t="policy"></label><input id="policy"></div>
    </div>
    <div class="row"><button class="btn" data-t="submit"></button>
      <button type="button" class="btn ghost" id="demo" data-t="demo"></button></div>
    <div id="err" class="err"></div>
  </form>

  <section id="out" class="hidden">
    <div id="banner" class="banner"></div>
    <div class="card"><h2 data-t="docs"></h2><ul class="check" id="docs"></ul></div>
    <div class="card"><h2 data-t="photos"></h2><ul id="photos"></ul></div>
    <div class="card"><h2 data-t="msg"></h2><pre id="msg"></pre>
      <div class="row"><button class="btn" id="copy" data-t="copy"></button>
        <a class="btn ghost" id="wa" target="_blank" rel="noopener" data-t="wa"></a></div></div>
    <div class="card"><h2 data-t="next"></h2><ul id="next"></ul></div>
    <p class="foot" data-t="confirm"></p>
  </section>
</div>

unsureNote:"नोंदणी माहीत नाही? तुमच्या बँकेत विचारा (कर्जदार शेतकरी बहुतेक वेळा नोंदणीकृत असतात) किंवा pmfby.gov.in वर तपासा, मग सूचना द्या.",
docList:["आधार कार्ड","7/12 उतारा आणि 8अ (जमिनीचा दाखला)","बँक पासबुक (आधारशी जोडलेले खाते)","PMFBY पॉलिसी किंवा अर्जाची पावती","पेरणीचा पुरावा / ई-पीक पाहणी नोंद","बटाई / भाडेकरार (मालक नसल्यास)"],
photoList:["कॅमेऱ्यात लोकेशन (GPS) आणि तारीख/वेळ चालू करा","संपूर्ण शेताचा 1 लांबून फोटो","खराब झाडे / साचलेले पाणी / भेगा पडलेली कोरडी जमीन यांचे 2–3 जवळून फोटो","विहीर, झाड किंवा सर्वे दगडासोबत 1 फोटो","फोटो एडिट किंवा फिल्टर करू नका. मूळ फोटो जपून ठेवा."],
nextLocal:["तुम्हाला डॉकेट / पोच क्रमांक मिळेल. तो जपून ठेवा.","सर्वेक्षक किंवा संयुक्त पथक (विमा कंपनी + कृषी विभाग) येईल. शेतावर हजर रहा.","ते तुमच्या शेताचे % नुकसान ठरवतील.","दावा योजनेच्या नियमांनुसार ठरून बँक खात्यात येतो. वेळ किंवा रकमेचे आश्वासन देता येत नाही."],
nextArea:["राज्य तुमच्या भागात उत्पादन मोजण्यासाठी पीक कापणी प्रयोग करते.","हंगामाच्या मध्यात उत्पादन खूप कमी दिसल्यास राज्य 'हंगामातील प्रतिकूल परिस्थिती' जाहीर करू शकते — आगाऊ रक्कम शक्य असू शकते.","दावा संपूर्ण भागासाठी नियमांनुसार ठरून बँक खात्यात येतो.","राज्य स्वतंत्रपणे दुष्काळ मदत जाहीर करू शकते. वेळ किंवा रकमेचे आश्वासन देता येत नाही."],

पीक: ${d.crop}, बाधित क्षेत्र: ${d.acres} एकर
कारण: ${d.eventName}
घटनेची तारीख: ${d.when}
PMFBY: ${d.pmfbyTxt}${d.policy?`, पॉलिसी/अर्ज क्र. ${d.policy}`:""}

जिओ-टॅग फोटो सोबत आहेत. कृपया माझे नुकसान नोंदवा आणि पाहणी करा.
— ${d.name}`}
};
const LOCAL = ["flood","hail","cloud","post"]; // 72-hour individual intimation
const $ = id => document.getElementById(id);
let lang = "mr";
try { lang = localStorage.getItem("ks-lang") || "mr"; } catch(e) {}

function setLang(l){
  lang = l; document.documentElement.lang = l;
  try { localStorage.setItem("ks-lang", l); } catch(e) {}
  const t = T[l];
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll(".langs button").forEach(b => b.classList.toggle("on", b.dataset.lang === l));
  const ci = $("crop").selectedIndex, ev = $("event").value;
  $("crop").innerHTML = t.crops.map((c,i) => `<option value="${i}">${c}</option>`).join("");
  $("crop").selectedIndex = ci < 0 ? 0 : ci;
  $("event").innerHTML = Object.entries(t.events).map(([k,v]) => `<option value="${k}">${v}</option>`).join("");
  if (ev) $("event").value = ev;
  if (!$("out").classList.contains("hidden")) build();
}
document.querySelectorAll(".langs button").forEach(b => b.onclick = () => setLang(b.dataset.lang));

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const list = (id, arr, check) => $(id).innerHTML = arr.map(x => check ? `<li><label><input type="checkbox"> ${esc(x)}</label></li>` : `<li>${esc(x)}</li>`).join("");

function build(){
  const t = T[lang];
  const name = $("name").value.trim(), acres = $("acres").value, dv = $("date").value;
  $("err").textContent = "";
  if (!name || !acres || !dv) { $("err").textContent = t.need; return; }
  const when = new Date(dv), hours = Math.floor((Date.now() - when) / 36e5);
  if (hours < 0) { $("err").textContent = t.future; return; }
  const ev = $("event").value, pm = $("pmfby").value, local = LOCAL.includes(ev);
  const dist = $("district").value === "other" ? t.other : $("district").value;

  let cls, title, body;
  if (!local) { cls = "area"; title = t.areaT; body = t.areaB; }
  else if (hours < 72) { cls = "urgent"; title = t.urgentT; body = t.urgentB(72 - hours); }
  else { cls = "late"; title = t.lateT; body = t.lateB(hours); }
  let extra = pm === "no" ? t.notEnrolled : pm === "unsure" ? t.unsureNote : "";
  $("banner").className = "banner " + cls;
  $("banner").innerHTML = `<b>${esc(title)}</b>${local ? `<div>⏱ ${hours} ${esc(t.hrs)}</div>` : ""}<div>${esc(body)}</div>${extra ? `<p style="margin:8px 0 0">${esc(extra)}</p>` : ""}`;

  list("docs", t.docList, true);
  list("photos", t.photoList);
  list("next", local ? t.nextLocal : t.nextArea);

  const msg = t.mk({ name, mobile: $("mobile").value.trim(), state: $("state").value.trim(), district: dist,
    village: $("village").value.trim(), survey: $("survey").value.trim(), crop: t.crops[$("crop").value], acres,
    eventName: t.events[ev], when: when.toLocaleString(lang === "en" ? "en-IN" : lang + "-IN"),
    pmfbyTxt: t[pm], policy: $("policy").value.trim() });
  $("msg").textContent = msg;
  $("wa").href = "https://wa.me/?text=" + encodeURIComponent(msg);
  $("out").classList.remove("hidden");
}

$("f").onsubmit = e => { e.preventDefault(); build(); if (!$("out").classList.contains("hidden")) $("out").scrollIntoView({behavior:"smooth"}); };
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("msg").textContent); } catch(e) {
    const r = document.createRange(); r.selectNodeContents($("msg")); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand("copy"); }
  $("copy").textContent = T[lang].copied; setTimeout(() => $("copy").textContent = T[lang].copy, 1500);
};
$("demo").onclick = () => {
  const d = new Date(Date.now() - 20 * 36e5); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  $("name").value = "Sunita Jadhav"; $("mobile").value = "9876543210"; $("district").value = "Latur";
  $("village").value = "Ausa"; $("survey").value = "142/2"; $("crop").value = "2"; $("acres").value = "2";
  $("event").value = "flood"; $("date").value = d.toISOString().slice(0,16); $("pmfby").value = "yes"; $("policy").value = "";
};
setLang(lang);
</script>
